name: Publish
on:
  push:
    branches: [ main ]
jobs:
  detect:
    steps:
      - uses: tj-actions/changed-files@v47
        with:
          base_branch: main
        id: changed
      - uses: ${{ vars.REPO_SCRIPT }}/.github/actions/${{ vars.SCRIPT }}@main
        with:
          changed: ${{ toJSON(steps.changed.outputs.all_changed_files) }}
          extension: avdl
        id: matrix
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: ubuntu-latest
  publish:
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ${{ matrix.domain }}/${{ matrix.usecase }}/${{ matrix.version }}/${{ matrix.event }}.avdl
            *.gradle.kts
            gradle/
            gradlew
      - uses: ${{ vars.REPO_ACTION }}/.github/actions/${{ vars.ACTION }}@main
        with:
          domain: ${{ matrix.domain }}
          usecase: ${{ matrix.usecase }}
          version: ${{ matrix.version }}
          contract: ${{ matrix.contract }}
          modules: ${{ matrix.modules }}
          tld: ${{ vars.TLD }}
          org: ${{ vars.ORG }}
          repo: ${{ vars.REPO_ARTIFACT }}
          event: ${{ vars.EVENT }}
          event_pat: ${{ secrets.PAT_EVENT }}
          artifact_pat: ${{ secrets.PAT_ARTIFACT }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    needs: detect
    runs-on: ubuntu-latest
